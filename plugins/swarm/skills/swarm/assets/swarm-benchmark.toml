# Benchmark-only override. Pass this absolute path through SWARM_CONFIG_PATH.
# Host assignments must ALSO specify model and effort explicitly.
schema_version = 4

[execution]
usage_saver = false
jev_model_selection = false
fast_mode = false
min_reasoning = "xhigh"
max_reasoning = "xhigh"

[model_capabilities."gpt-6.1-sol"]
# Official model documentation checked 2026-10-01. Host availability is separate.
provider = "openai"
workloads = ["simple", "general", "large_goal", "review"]
tools = ["shell", "web", "computer_use", "image_input"]
reasoning = ["low", "medium", "high", "xhigh", "max"]

[chat_relay]
enabled = false

[boost]
spark_enabled = false

[models.high]
ctrl_model = "gpt-6.1-sol"
ctrl_reasoning = "xhigh"
lead_model = "gpt-6.1-sol"
