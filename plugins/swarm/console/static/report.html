<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="SWARM daily project report" />
    <title>Daily report · SWARM HQ</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/swarm-icon-64.png" />
    <link rel="stylesheet" href="/report.css" />
  </head>
  <body>
    <main class="report-shell">
      <header class="report-header">
        <a href="/" aria-label="Back to SWARM HQ"><img src="/assets/swarm-wordmark.png" width="536" height="119" alt="SWARM" /></a>
        <div class="report-actions">
          <label for="report-scope"><span class="sr-only">Project</span><select id="report-scope" aria-label="Project"><option value="all">Portfolio</option></select></label>
          <button id="print-report" type="button">Save PDF</button>
        </div>
      </header>
      <section class="report-intro" aria-labelledby="report-title">
        <div><p class="eyebrow">Daily report</p><h1 id="report-title">Portfolio</h1></div>
        <time id="report-time"></time>
      </section>
      <div class="report-status" id="report-status" role="status" aria-label="Loading report"><span class="spinner" aria-hidden="true"></span></div>
      <section class="metric-grid" id="report-metrics" aria-label="Daily summary"></section>
      <section class="project-list" id="report-projects" aria-label="Project updates"></section>
    </main>
    <script src="/report.js"></script>
  </body>
</html>
