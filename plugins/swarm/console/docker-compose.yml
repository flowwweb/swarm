name: swarm-console

services:
  swarm-console:
    build:
      context: ..
      dockerfile: console/Dockerfile
    user: "${SWARM_CONTAINER_USER:-swarm}"
    ports:
      - "127.0.0.1:4788:4788"
    environment:
      CODEX_HOME: /data/codex
      SWARM_CONFIG_PATH: "${SWARM_CONTAINER_CONFIG_PATH:-/data/swarm/config.toml}"
      SWARM_CONSOLE_DATA_DIR: /data/swarm-console
      SWARM_CONSOLE_DOCKER_LOOPBACK: "1"
    volumes:
      - "${SWARM_CODEX_HOME:?Run python console/docker.py so the Codex home is explicit}:/data/codex:ro"
      - "${SWARM_PROOF_HOME:?Run python console/docker.py so the proof store is explicit}:/data/codex/swarm:rw"
      - "${SWARM_CONFIG_HOME:?Run python console/docker.py so the SWARM config home is explicit}:/data/swarm:rw"
      - "swarm_console_state:/data/swarm-console"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  swarm_console_state:
    name: swarm-console-state
