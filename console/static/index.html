<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#02071f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SWARM" />
    <meta name="description" content="Local SWARM control and analytics console" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/swarm-favicon.svg" />
    <title>🐙 SWARM Console</title>
    <link rel="icon" type="image/svg+xml" href="/swarm-favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="app-shell">
      <div class="sidepanel-region">
        <div class="rail-control">
          <button class="rail-toggle" id="rail-toggle" type="button" aria-label="Expand sidepanel" aria-controls="console-sidepanel" aria-expanded="false" title="Expand sidepanel">
            <svg aria-hidden="true" class="lucide lucide-panel-left" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="2"></rect>
              <path d="M9 3v18"></path>
            </svg>
          </button>
        </div>
        <aside class="rail" id="console-sidepanel" aria-label="SWARM Console navigation" aria-hidden="true" inert>
          <div class="brand">
            <button class="panel-collapse" id="panel-collapse" type="button" aria-label="Keep sidepanel open" aria-controls="console-sidepanel" aria-expanded="false" title="Keep sidepanel open">
              <img class="brand-wordmark" src="/assets/swarm-wordmark.png" alt="" />
              <svg aria-hidden="true" class="lucide lucide-panel-left" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                <path d="M9 3v18"></path>
              </svg>
            </button>
          </div>
          <nav class="nav-list">
            <button class="nav-item is-active" data-view="swarm" type="button" aria-label="Graph" title="Graph">
              <span aria-hidden="true">⌘</span><b>Graph</b>
            </button>
            <button class="nav-item" data-view="settings" type="button" aria-label="Settings" title="Settings">
              <span aria-hidden="true">⚙</span><b>Settings</b>
            </button>
          </nav>
          <div class="rail-foot">
            <span class="privacy-light" aria-hidden="true"></span>
            <div><strong>Local only</strong><small>Prompts stay out</small></div>
          </div>
        </aside>
      </div>

      <main class="workspace">
        <header class="topbar">
          <h1 id="view-title">Graph</h1>
          <div class="top-actions">
            <div class="live-status" role="status"><span></span><b>LIVE</b><small id="sync-time">Connecting</small></div>
            <button class="icon-button" id="refresh" type="button" aria-label="Refresh console">↻</button>
          </div>
        </header>

        <section class="view is-active" id="view-swarm" data-view-panel="swarm">
          <div class="section-intro">
            <p class="scope-copy" id="scope-copy" role="status" aria-live="polite"></p>
            <div class="graph-filters">
              <label class="project-picker">CTRL
                <select id="controller-filter" aria-label="Filter graph by CTRL"></select>
              </label>
              <label class="project-picker">Project
                <select id="project-filter" aria-label="Filter swarm by project"></select>
              </label>
            </div>
          </div>
          <section class="swarm-stage" aria-label="Animated SWARM hierarchy">
            <div class="swarm-scroll">
              <div class="swarm-canvas" id="swarm-canvas">
                <svg id="swarm-links" aria-hidden="true"></svg>
                <div id="swarm-nodes"></div>
              </div>
            </div>
          </section>
          <p class="graph-boundary">Host-observed graph · SWARM runtime remains authoritative.</p>
          <section class="panel usage-panel" aria-labelledby="usage-heading">
            <div class="panel-head"><div><h2 id="usage-heading">Usage</h2><p class="panel-kicker" id="usage-scope"></p></div><span class="usage-badge">HOST REPORTED</span></div>
            <div class="usage-body" id="scope-usage"></div>
          </section>
          <section class="panel activity-panel" aria-labelledby="activity-heading">
            <div class="panel-head"><h2 id="activity-heading">Activity</h2></div>
            <div class="pulse-list" id="scope-activity"></div>
          </section>
          <section class="panel proof-panel" aria-labelledby="proof-heading">
            <div class="panel-head"><h2 id="proof-heading">Proof</h2><span class="proof-badge" id="proof-badge">Unavailable</span></div>
            <div class="proof-body" id="scope-proof"></div>
          </section>
        </section>

        <section class="view" id="view-settings" data-view-panel="settings">
          <div class="settings-actions">
            <button class="primary-button" id="save-settings" type="button" disabled>Save changes</button>
            <div class="settings-status" id="settings-status" role="status" aria-live="polite"></div>
          </div>
          <form id="settings-form">
            <div class="settings-grid" id="settings-grid"></div>
          </form>
          <div class="config-path"><span>Config</span><code id="config-path"></code></div>
        </section>

        <section class="error-surface" id="error-surface" hidden role="alert">
          <span>!</span><div><strong>Console unavailable</strong><p id="error-message"></p></div>
        </section>
      </main>
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>
