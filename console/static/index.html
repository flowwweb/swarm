<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Local SWARM control and analytics console" />
    <title>🐙 SWARM Console</title>
    <link rel="icon" href="/assets/swarm-wordmark.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <div class="app-shell">
      <aside class="rail" aria-label="SWARM Console navigation">
        <div class="brand">
          <img class="brand-wordmark" src="/assets/swarm-wordmark.png" alt="SWARM" />
          <span class="brand-compact" aria-hidden="true">🐙</span>
          <button class="rail-toggle" id="rail-toggle" type="button" aria-label="Collapse sidebar" aria-expanded="true" title="Collapse sidebar"><span aria-hidden="true">‹</span></button>
        </div>
        <nav class="nav-list">
          <button class="nav-item is-active" data-view="swarm" type="button" aria-label="Graph" title="Graph">
            <span aria-hidden="true">⌘</span><b>Graph</b>
          </button>
          <button class="nav-item" data-view="settings" type="button" aria-label="Settings" title="Settings">
            <span aria-hidden="true">⚙</span><b>Settings</b>
          </button>
        </nav>
        <div class="rail-foot">
          <span class="privacy-light" aria-hidden="true"></span>
          <div><strong>Local only</strong><small>Prompts stay out</small></div>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <h1 id="view-title">Graph</h1>
          <div class="top-actions">
            <div class="live-status" role="status"><span></span><b>LIVE</b><small id="sync-time">Connecting</small></div>
            <button class="icon-button" id="refresh" type="button" aria-label="Refresh console">↻</button>
          </div>
        </header>

        <section class="view is-active" id="view-swarm" data-view-panel="swarm">
          <div class="section-intro">
            <p class="scope-copy" id="scope-copy" role="status" aria-live="polite"></p>
            <div class="graph-filters">
              <label class="project-picker">CTRL
                <select id="controller-filter" aria-label="Filter graph by CTRL"></select>
              </label>
              <label class="project-picker">Project
                <select id="project-filter" aria-label="Filter swarm by project"></select>
              </label>
            </div>
          </div>
          <section class="swarm-stage" aria-label="Animated SWARM hierarchy">
            <div class="swarm-scroll">
              <div class="swarm-canvas" id="swarm-canvas">
                <svg id="swarm-links" aria-hidden="true"></svg>
                <div id="swarm-nodes"></div>
              </div>
            </div>
          </section>
          <p class="graph-boundary">Host-observed graph · SWARM runtime remains authoritative.</p>
          <section class="panel activity-panel" aria-labelledby="activity-heading">
            <div class="panel-head"><h2 id="activity-heading">Activity</h2></div>
            <div class="pulse-list" id="scope-activity"></div>
          </section>
        </section>

        <section class="view" id="view-settings" data-view-panel="settings">
          <div class="settings-actions">
            <button class="primary-button" id="save-settings" type="button" disabled>Save changes</button>
          </div>
          <div class="settings-status" id="settings-status" role="status" aria-live="polite"></div>
          <form id="settings-form">
            <div class="settings-grid" id="settings-grid"></div>
          </form>
          <div class="config-path"><span>Config</span><code id="config-path"></code></div>
        </section>

        <section class="error-surface" id="error-surface" hidden role="alert">
          <span>!</span><div><strong>Console unavailable</strong><p id="error-message"></p></div>
        </section>
      </main>
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>
