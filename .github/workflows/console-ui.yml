name: Console UI

on:
  pull_request:
    paths:
      - "console/**"
      - "skills/swarm/assets/swarm-wordmark.png"
      - ".github/workflows/console-ui.yml"
  push:
    branches:
      - "**"
    paths:
      - "console/**"
      - "skills/swarm/assets/swarm-wordmark.png"
      - ".github/workflows/console-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install pinned browser tooling
        shell: bash
        working-directory: console
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run responsive interaction proof
        shell: bash
        working-directory: console
        run: npm run test:ui
