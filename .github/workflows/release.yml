name: Draft release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      console_ui_required: ${{ steps.proof.outputs.console_ui_required }}
    steps:
      - name: Check out tag history for proof selection
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select release browser proof from changed surfaces
        id: proof
        shell: bash
        run: |
          previous="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if test -z "$previous" || ! git diff --quiet "$previous" "$GITHUB_SHA" -- console skills/swarm/assets/swarm-wordmark.png; then
            echo "console_ui_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "console_ui_required=false" >> "$GITHUB_OUTPUT"
          fi

  gates:
    needs: scope
    uses: ./.github/workflows/validate.yml
    with:
      console_ui_required: ${{ needs.scope.outputs.console_ui_required == 'true' }}

  release:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          check-latest: false

      - name: Download the exact validated package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: swarm-release-candidate
          path: dist

      - name: Require the tag to match the plugin version
        shell: bash
        run: |
          expected="v$(python -c 'import json; print(json.load(open(".codex-plugin/plugin.json", encoding="utf-8"))["version"])')"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "$expected"

      - name: Verify the validated release ZIP
        id: package
        shell: bash
        run: |
          archive="$GITHUB_WORKSPACE/dist/swarm-release.zip"
          installed="$RUNNER_TEMP/swarm-release-installed"
          python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$archive" "$installed"
          python skills/swarm/scripts/verify_plugin_install.py "$installed" --package "$archive"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Attest the release ZIP provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256

      - name: Create a draft release with the ZIP and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256"
