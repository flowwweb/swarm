name: Validate plugin

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          check-latest: false

      - name: Test skill runtime, plugin, and host manifests
        shell: bash
        run: |
          python scripts/sync_plugin_mirror.py --check
          python -m unittest discover -s skills/swarm/tests -p 'test_*.py'
          python -m unittest discover -s console/tests -p 'test_*.py'
          # console/tests/test_console_ui.mjs deliberately remains optional: it
          # imports Playwright, which is not declared by this repository.

      - name: Build and verify a deterministic package
        shell: bash
        run: |
          archive="$RUNNER_TEMP/swarm-ci-${{ matrix.os }}.zip"
          installed="$RUNNER_TEMP/swarm-ci-${{ matrix.os }}-installed"
          python scripts/build_package.py --source . --output "$archive" --verify-repeat
          python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$archive" "$installed"
          python skills/swarm/scripts/verify_plugin_install.py "$installed" --package "$archive"
