name: Validate plugin

on:
  workflow_call:
    inputs:
      platform_required:
        description: Require OS-sensitive contracts on all supported platforms
        type: boolean
        default: true
      package_required:
        description: Build once and verify the exact package on all supported platforms
        type: boolean
        default: true
      console_ui_required:
        description: Require provisioned responsive console proof for this exact revision
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  console-ui:
    name: Required console UI
    if: inputs.console_ui_required
    runs-on: ubuntu-latest
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install pinned browser tooling
        shell: bash
        working-directory: console
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run responsive interaction proof
        shell: bash
        working-directory: console
        run: npm run test:ui

  fast-contracts:
    name: Fast contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          check-latest: false
      - name: Run contracts without package integration
        shell: bash
        run: |
          python scripts/sync_plugin_mirror.py --check
          python scripts/run_test_tier.py fast
          python -m unittest discover -s console/tests -p 'test_*.py'

  platform-floor:
    name: Platform floor / ${{ matrix.os }}
    if: inputs.platform_required
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          check-latest: false
      - name: Run OS-sensitive contracts
        shell: bash
        run: python scripts/run_test_tier.py platform

  package-build:
    name: Build immutable package
    if: inputs.package_required
    needs: fast-contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          check-latest: false
      - name: Run package integration and build once
        shell: bash
        run: |
          python -m unittest skills.swarm.tests.test_release_package
          python scripts/build_package.py --source . --output "$RUNNER_TEMP/swarm-release.zip" --verify-repeat
      - name: Upload the immutable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swarm-release-candidate
          path: |
            ${{ runner.temp }}/swarm-release.zip
            ${{ runner.temp }}/swarm-release.zip.sha256
          if-no-files-found: error
          retention-days: 7

  package-verify:
    name: Verify package / ${{ matrix.os }}
    if: inputs.package_required
    needs: package-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          check-latest: false
      - name: Download the exact package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: swarm-release-candidate
          path: dist
      - name: Verify installed package bytes
        shell: bash
        run: |
          python -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" dist/swarm-release.zip "$RUNNER_TEMP/swarm-installed"
          python skills/swarm/scripts/verify_plugin_install.py "$RUNNER_TEMP/swarm-installed" --package dist/swarm-release.zip
