# Global SWARM settings
#
# Canonical location: ~/.agents/swarm/config.toml.
# Changes apply the next time SWARM schedules or manages work. The latest direct
# user instruction always wins. Safety, user control, and a user-visible host
# task hierarchy are fixed SWARM invariants and cannot be disabled here.

schema_version = 2

[portfolio]
# Total user-visible SWARM tasks that may be active at once, excluding MOTHER.
max_active_tasks = 4
# Preferred number of independent artifact tasks to start when work supports it.
default_parallel_tasks = 3
# Reuse a matching live task instead of creating a duplicate owner.
reuse_existing_tasks = true

[role_icons]
# Every SWARM title uses exactly one role emoji by default. Set enabled=false
# only when all SWARM task-title emojis should be disabled.
enabled = true
ctrl = "🐙"
mother = "⚡"
lead = "🧭"
review = "🔎"
# Generic DOER icon only when no contextual role has a clearly logical choice.
fallback = "📋"
doer_choices = ["🔨", "💻", "✏️", "🎨", "📚", "📊", "🔌", "🧪", "✅", "📝", "🔀", "🚀"]

[execution]
# Select high, medium, or low. Leave service_tier empty to keep the host default.
# Set it to "fast" only when the host exposes and supports that tier.
usage_profile = "medium"
service_tier = ""
# Reduce avoidable coordination churn in new work without changing the selected
# models, requested outcome, required proof, independent review, or authority.
usage_saver = false

[efficiency]
mode = "BALANCED"
doer_wip_limit = 3

[hive]
# Compact SWARM continuity only: durable lessons without a new memory service.
enabled = true
cleanup_strategy = "adaptive"
retention_strategy = "adaptive"
worker_strategy = "warm_when_useful"
archive_behavior = "provenance"

[boost]
# Boost is optional closeout behavior. MOTHER, LEAD, and persistent ARCHITECT
# goals plus the passive heartbeat are mandatory and cannot be disabled here.
# Make manual Boost mode available. Starting a Boost goal still requires a
# direct user request; SWARM never infers or auto-starts one from quota state.
enabled = true
# Valid strategies: durable_goal, closeout_first, hands_off, spark_simple_work.
strategies = ["durable_goal", "closeout_first", "hands_off", "spark_simple_work"]
# Percentage of remaining host-reported usage. These activate only inside an
# explicitly Boost-authorized SWARM run with real usage telemetry.
plan_at_remaining_percent = 5
decide_at_remaining_percent = 2
launch_at_remaining_percent = 1
# Existing hierarchy levels that receive substantial owner-level closeout goals.
goal_levels = ["mother", "lead", "doer", "review"]
# Reserve model for simple targeted work when its separate allowance is available.
spark_model = "gpt-5.3-codex-spark"

[models.high]
mother_model = "gpt-5.6-sol"
mother_reasoning = "medium"
lead_model = "gpt-5.6-sol"
lead_reasoning = "medium"
doer_model = "gpt-5.6-luna"
doer_reasoning = "xhigh"
task_model = "gpt-5.6-luna"
task_reasoning = "high"
subtask_model = "gpt-5.6-luna"
subtask_reasoning = "high"
assist_model = "gpt-5.6-sol"
assist_reasoning = "medium"
advisor_model = "gpt-5.6-sol"
advisor_reasoning = "medium"
architect_model = "gpt-5.6-sol"
architect_reasoning = "medium"
review_model = "gpt-5.6-sol"
review_reasoning = "medium"

[models.medium]
mother_model = "gpt-5.6-sol"
mother_reasoning = "medium"
lead_model = "gpt-5.6-sol"
lead_reasoning = "medium"
doer_model = "gpt-5.6-luna"
doer_reasoning = "xhigh"
task_model = "gpt-5.6-luna"
task_reasoning = "high"
subtask_model = "gpt-5.6-luna"
subtask_reasoning = "high"
assist_model = "gpt-5.6-sol"
assist_reasoning = "medium"
advisor_model = "gpt-5.6-sol"
advisor_reasoning = "medium"
architect_model = "gpt-5.6-sol"
architect_reasoning = "medium"
review_model = "gpt-5.6-sol"
review_reasoning = "medium"

[models.low]
mother_model = "gpt-5.6-sol"
mother_reasoning = "medium"
lead_model = "gpt-5.6-sol"
lead_reasoning = "medium"
doer_model = "gpt-5.6-luna"
doer_reasoning = "xhigh"
task_model = "gpt-5.6-luna"
task_reasoning = "high"
subtask_model = "gpt-5.6-luna"
subtask_reasoning = "high"
assist_model = "gpt-5.6-sol"
assist_reasoning = "medium"
advisor_model = "gpt-5.6-sol"
advisor_reasoning = "medium"
architect_model = "gpt-5.6-sol"
architect_reasoning = "medium"
review_model = "gpt-5.6-sol"
review_reasoning = "medium"

# MOTHER routes only work and tools declared for the selected model. Add Kimi,
# Qwen, or another Codex provider model here after configuring that provider.
[model_capabilities."gpt-5.6-sol"]
provider = "openai"
workloads = ["general", "large_goal", "review"]
tools = ["shell", "web", "computer_use", "image_input"]

[model_capabilities."gpt-5.6-terra"]
provider = "openai"
workloads = ["simple", "general", "large_goal", "review"]
tools = ["shell", "web", "computer_use", "image_input"]

[model_capabilities."gpt-5.6-luna"]
provider = "openai"
workloads = ["simple", "general", "large_goal"]
tools = ["shell", "web", "computer_use", "image_input"]

[model_capabilities."gpt-5.3-codex-spark"]
provider = "openai"
workloads = ["simple"]
tools = ["shell", "web"]

[roles]
# SPECIALIST is a free role: add any short concrete profession needed. These
# six examples are defaults, not an allowlist, and each may be used repeatedly.
[roles.ARCHITECT]
icon = "🏗️"
[roles.ENGINEER]
icon = "⚙️"
[roles.DESIGNER]
icon = "🎨"
[roles.RESEARCHER]
icon = "🔬"
[roles.ANALYST]
icon = "📊"
[roles.STRATEGIST]
icon = "🧭"

[labels]
# Portfolio orchestrator; its emoji comes from role_icons.mother.
mother = "MOTHER"
# Domain coordinator; emoji from role_icons.lead.
lead = "LEAD"
# Execution fallback only. Prefer the real DOER specialty: BUILD, DEV, DESIGN, VISUAL, etc.
doer = "DOER"
task = "TASK"
subtask = "SUBTASK"
assist = "ASSIST"
advisor = "ADVISOR"
architect = "ARCHITECT"
# Generic fallback only; specialist task titles use their concrete role name.
specialist = "SPECIALIST"
# Independent review role; emoji from role_icons.review.
review = "REVIEW"

[coordination]
# Permit justified LEAD coordination tasks.
allow_coordinators = true
# A justified LEAD must own at least this many child tasks.
coordinator_min_children = 2
# Soft span preference for every justified owner split. Three guides MOTHER,
# LEAD, DOER, REVIEW, and consequential planning work; it is never a quota,
# trigger, or hard cutoff.
preferred_lane_width = 3
# Maximum locally measurable window for CTRL_DIRECT atomic work.
ctrl_direct_horizon_minutes = 20

[subagents]
# Permit bounded internal subagents inside an existing Codex task.
enabled = true
# Safety ceiling for internal subagents. preferred_lane_width is the normal
# target; this higher ceiling permits a justified exception without reconfiguring.
max_per_task = 8
# Valid values: exploration, implementation, testing, review.
allowed_for = ["exploration", "implementation", "testing", "review"]

[review]
# Create a dedicated REVIEW task when SWARM's review rules call for one. Turning
# this off keeps QC mandatory but performs it inside an owning or MOTHER task.
task_enabled = true
# Maximum user-visible REVIEW tasks active at once.
max_parallel_tasks = 3
# Add review capacity when at least this many ready artifacts would queue.
scale_when_queue_reaches = 2

[monitoring]
heartbeat_enabled = true
# Passive MOTHER heartbeat cadence. It reads active descendants without
# messaging, interrupting, or steering them.
heartbeat_minutes = 30
# Canonical goal review horizons. Small tasks should normally choose 10-20m.
default_review_horizon_minutes = 30
max_review_horizon_minutes = 60
small_task_review_horizon_minutes = 15

[recovery]
# Exactly one bounded same-surface recovery attempt; this is non-disableable.
max_attempts = 1
# A lane stalls after this many unchanged owner work updates; heartbeat excluded.
stall_after_updates = 2

[lifecycle]
# Pin SWARM-created tasks when they are created.
pin_created_tasks = false
# Archive only after terminal acceptance when no concrete retention reason
# remains. Pending review, correction, choice, continuation, goals, ownership,
# handoffs, and ambiguity keep the task open.
archive_completed_tasks = true

[hygiene]
# Archive preserves searchable provenance; it never deletes a task. Values are days.
no_review_archive_delay = 0
low_review_retention = 7
high_review_retention = 30
stale_task_archive_delay = 1
completed_task_retention = 30
# Pinned work is exempt until manually unpinned or, if selected, project close.
pinned_item_policy = "manual"

[feedback]
# Make the on-demand SWARM feedback workflow available.
enabled = true
# Add privacy-safe SWARM version and policy settings to feedback packets.
include_diagnostics = true
# Offer one optional feedback line after an accepted portfolio. Off avoids nagging.
prompt_on_close = false
# Optional issue URL, email address, or channel. Empty returns a portable packet.
# SWARM never submits feedback without a direct user instruction.
# Do not store tokens, credentials, or private routing data here.
destination = ""
